name: Verify BNBX contracts on BscScan

on:
  workflow_dispatch:
    inputs:
      standard_factory_address:
        description: "Deployed BNBX V4 standard Factory"
        required: true
        type: string
      rewards_factory_address:
        description: "Deployed BNBX V4 holder/LP rewards Factory"
        required: true
        type: string
      token_deployer_address:
        description: "Optional V4 advanced token deployer cross-check"
        required: false
        type: string
      verify_launched_tokens:
        description: "Also verify every registered V4 token, Curve, and reward vault"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-bsc-mainnet.yml"
      - "packages/contracts/scripts/verify-source-mainnet.mjs"

permissions:
  contents: read

concurrency:
  group: verify-bnbx-mainnet
  cancel-in-progress: false

jobs:
  verify:
    name: Verify infrastructure and launched tokens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BSC_SCAN_API_KEY: ${{ secrets.BSC_SCAN_API_KEY }}
      BSC_MAINNET_RPC_URL: ${{ secrets.BSC_MAINNET_RPC_URL }}
      BNBX_CONTRACT_VERSION: V4
      BNBX_V4_STANDARD_FACTORY_ADDRESS: ${{ inputs.standard_factory_address || '0x6012aa2eb5164c8ed31f2a01950c3b5037211181' }}
      BNBX_V4_REWARDS_FACTORY_ADDRESS: ${{ inputs.rewards_factory_address || '0xe4aAF8066bf1063CFd73dc9a784598DFFa412014' }}
      BNBX_V4_TOKEN_DEPLOYER_ADDRESS: ${{ inputs.token_deployer_address || '0xbCf50926684726DA1C3674f110fCAb755E181525' }}
      VERIFY_LAUNCHED_TOKENS: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_launched_tokens && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # These deployed rewards contracts came from this exact generated
          # artifact. Pin the full commit so BscScan publishes the source that
          # is actually on-chain, not the later reviewed replacement.
          ref: d8d953db9cd151d7b130b22f347aba4c9d513d92

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm --filter @bnbx/contracts build

      - name: Verify all mainnet contracts
        run: pnpm --filter @bnbx/contracts verify-source:mainnet:v4
