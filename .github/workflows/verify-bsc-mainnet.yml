name: Verify BNBX contracts on BscScan

on:
  workflow_dispatch:
    inputs:
      standard_factory_address:
        description: "Deployed BNBX V3 standard Factory"
        required: true
        type: string
      rewards_factory_address:
        description: "Deployed BNBX V3 holder/LP rewards Factory"
        required: true
        type: string
      token_deployer_address:
        description: "Optional V3 advanced token deployer cross-check"
        required: false
        type: string
      verify_launched_tokens:
        description: "Also verify every registered V3 token, Curve, and reward vault"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-bsc-mainnet.yml"
      - "packages/contracts/scripts/verify-source-mainnet.mjs"

permissions:
  contents: read

concurrency:
  group: verify-bnbx-mainnet
  cancel-in-progress: false

jobs:
  verify:
    name: Verify infrastructure and launched tokens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BSC_SCAN_API_KEY: ${{ secrets.BSC_SCAN_API_KEY }}
      BSC_MAINNET_RPC_URL: ${{ secrets.BSC_MAINNET_RPC_URL }}
      BNBX_V3_STANDARD_FACTORY_ADDRESS: ${{ inputs.standard_factory_address || '0xc5f6d2b221dfd950f919b82c77d82fc427f31b3d' }}
      BNBX_V3_REWARDS_FACTORY_ADDRESS: ${{ inputs.rewards_factory_address || '0xef95ead95292408090e61112580f62e4d556c550' }}
      BNBX_V3_TOKEN_DEPLOYER_ADDRESS: ${{ inputs.token_deployer_address || '0x0e5e09a760423e0d06125a63480e2d94652061bc' }}
      VERIFY_LAUNCHED_TOKENS: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_launched_tokens && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm --filter @bnbx/contracts build

      - name: Verify all mainnet contracts
        run: pnpm --filter @bnbx/contracts verify-source:mainnet
