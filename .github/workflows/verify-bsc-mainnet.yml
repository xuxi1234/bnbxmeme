name: Verify BNBX contracts on BscScan
run-name: Verify BNBX contracts ${{ inputs.launch_tx_hash || github.event_name }}

on:
  schedule:
    # Scan both production factories regularly so newly launched contracts are
    # published on BscScan without requiring an operator to run this workflow.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      standard_factory_address:
        description: "Deployed BNBX V4 standard Factory"
        required: true
        type: string
      rewards_factory_address:
        description: "Deployed BNBX V4 holder/LP rewards Factory"
        required: true
        type: string
      token_deployer_address:
        description: "Optional V4 advanced token deployer cross-check"
        required: false
        type: string
      verify_launched_tokens:
        description: "Also verify every registered V4 token, Curve, and reward vault"
        required: true
        default: true
        type: boolean
      launch_tx_hash:
        description: "Optional confirmed BNBX launch transaction for immediate verification"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-bsc-mainnet.yml"
      - "packages/contracts/scripts/verify-source-mainnet.mjs"

permissions:
  contents: read

concurrency:
  group: verify-bnbx-mainnet
  cancel-in-progress: false

jobs:
  verify:
    name: Verify infrastructure and launched tokens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BSC_SCAN_API_KEY: ${{ secrets.BSC_SCAN_API_KEY }}
      BSC_MAINNET_RPC_URL: ${{ secrets.BSC_MAINNET_RPC_URL }}
      BNBX_CONTRACT_VERSION: V4
      BNBX_V4_STANDARD_FACTORY_ADDRESS: ${{ inputs.standard_factory_address || '0x510dbBE270b2F009619BCbcF757aE2e2D48734Ad' }}
      BNBX_V4_REWARDS_FACTORY_ADDRESS: ${{ inputs.rewards_factory_address || '0x28100dBFA3F1a3D563e1667259433AdFA3aaC4BB' }}
      BNBX_V4_TOKEN_DEPLOYER_ADDRESS: ${{ inputs.token_deployer_address || '0x6Be576ab1b2874641DE5Ac41069C57a16A5C892c' }}
      VERIFY_LAUNCHED_TOKENS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.verify_launched_tokens) || github.event_name == 'schedule' || github.event_name == 'push') && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm --filter @bnbx/contracts build

      - name: Verify all mainnet contracts
        run: pnpm --filter @bnbx/contracts verify-source:mainnet:v4
